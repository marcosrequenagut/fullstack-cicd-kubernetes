name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Pytest
        run: pytest
  
  deploy:
    runs-on: self-hosted
    needs: [lint, test]
    if: github.event_name == 'push'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set namespace
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "NAMESPACE=prod" >> $GITHUB_ENV
          else
            echo "NAMESPACE=dev" >> $GITHUB_ENV
          fi

      - name: Build backend image
        run: |
          eval $(minikube docker-env)
          docker build -t backend:latest ./backend
      
      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/$NAMESPACE/

      - name: Restart backend to pick up new image
        run: kubectl rollout restart deployment/backend -n $NAMESPACE
