apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: backend:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: postgres-secret
            - secretRef:
                name: telegram-secret
          ports:
            - containerPort: 8000